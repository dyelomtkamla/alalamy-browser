# يبني نسخة الآيفون على جهاز ماك مجاني من GitHub ويرفعها في صفحة Releases باسم "iOS build".
# الناتج AlalamyBrowser.ipa غير موقّع: تثبّته على آيفونك بـ Sideloadly بحساب Apple ID عادي.
name: iOS build
on:
  workflow_dispatch:
  push:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project AlalamyBrowser.xcodeproj -scheme AlalamyBrowser -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/AlalamyBrowser.app Payload/
          zip -qr AlalamyBrowser.ipa Payload
      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios --yes --cleanup-tag || true
          gh release create ios AlalamyBrowser.ipa --prerelease --title "iOS build" \
            --notes "نسخة الآيفون (غير موقّعة). ثبّتها بـ Sideloadly من الكمبيوتر بحساب Apple ID."
      - uses: actions/upload-artifact@v4
        with:
          name: AlalamyBrowser-ios
          path: ios/AlalamyBrowser.ipa
