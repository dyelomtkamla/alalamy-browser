# مشروع XcodeGen — على الماك: brew install xcodegen && xcodegen generate && open AlalamyBrowser.xcodeproj
name: AlalamyBrowser
options:
  bundleIdPrefix: com.alalamy
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ar
targets:
  AlalamyBrowser:
    type: application
    platform: iOS
    sources: [AlalamyBrowser]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alalamy.browser
        PRODUCT_NAME: AlalamyBrowser
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "متصفح العالمي"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "بعض المواقع تحتاج الكاميرا (مثل مكالمات الفيديو)."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "بعض المواقع تحتاج الميكروفون."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "بعض المواقع تطلب موقعك."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "لحفظ الصور التي تنزّلها."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSHumanReadableCopyright: "جميع الحقوق محفوظة © Ahmed Gamal Elshafey"
        CODE_SIGN_STYLE: Automatic
